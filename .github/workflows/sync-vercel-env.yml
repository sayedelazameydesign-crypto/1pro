name: Sync production keys to Vercel

# The operator keeps the deployment keys in GitHub, but production runs on Vercel,
# and Vercel cannot read GitHub secrets. This workflow is the bridge: a runner is
# the only place GitHub exposes secret *values*, so it reads them there, validates
# every one of them, writes them into the Vercel project as Production variables,
# redeploys, and verifies the live service. It never prints a value: the script it
# calls redacts every line it emits (see scripts/vercel_env_sync.sh).
#
# Nothing of the repository is modified. Run it by hand (Actions -> this workflow
# -> Run workflow), or keep the temporary push trigger below until it lands on main.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate the secrets only; change nothing on Vercel"
        type: boolean
        default: false
  # TEMPORARY: lets this branch prove the flow before the file reaches main.
  # Remove this block (and the branch guard is then moot) when merging to main.
  push:
    branches:
      - arena/79021108-1pro

permissions:
  contents: read

concurrency:
  group: sync-vercel-env
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Declaring the environment means the job also sees secrets and variables that
    # were attached to the "Production" environment instead of the repository.
    environment: Production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install psycopg so the database URL is proven by a live query
        run: python -m pip install --quiet "psycopg[binary]~=3.2"

      - name: Flag any key stored as a variable instead of a secret
        env:
          # Presence only: nothing here prints a value.
          V_DATABASE_URL: ${{ vars.DATABASE_URL }}
          V_GEMINI_API_KEY: ${{ vars.GEMINI_API_KEY }}
          V_WAHA_SECRET: ${{ vars.WAHA_SECRET }}
          V_VERCEL_TOKEN: ${{ vars.VERCEL_TOKEN }}
        run: |
          for name in DATABASE_URL GEMINI_API_KEY WAHA_SECRET VERCEL_TOKEN; do
            key="V_$name"
            if [ -n "${!key:-}" ]; then
              echo "::warning title=variable::$name is set as a repository or environment VARIABLE. This repository is public, so its variables are readable by anyone -- move $name to Actions secrets (and delete the variable)."
            fi
          done

      - name: Read GitHub secrets, push them to Vercel, verify production
        id: sync
        env:
          # Every alias is tried in order; the first non-empty one wins. `vars.*`
          # is the fallback for a key that was stored as a repository/environment
          # *variable* instead of a secret (secrets are the safer place).
          # `secrets.X || vars.X`: a key stored as a repository/environment
          # *variable* still works, and the step below says so out loud. Either
          # way the value must be non-empty for the name to be reported as found.
          DATABASE_URL: ${{ secrets.DATABASE_URL || vars.DATABASE_URL }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL || vars.NEON_DATABASE_URL }}
          DATABASE_PRIVATE_URL: ${{ secrets.DATABASE_PRIVATE_URL }}
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          POSTGRES_PRISMA_URL: ${{ secrets.POSTGRES_PRISMA_URL }}
          POSTGRES_URL_NON_POOLING: ${{ secrets.POSTGRES_URL_NON_POOLING }}
          NEON_POSTGRES_URL: ${{ secrets.NEON_POSTGRES_URL }}
          NEON_URL: ${{ secrets.NEON_URL }}
          NEON_CONNECTION_STRING: ${{ secrets.NEON_CONNECTION_STRING }}
          DATABASE_CONNECTION_STRING: ${{ secrets.DATABASE_CONNECTION_STRING }}
          WAHA_DATABASE_URL: ${{ secrets.WAHA_DATABASE_URL }}
          POSTGRESQL_URL: ${{ secrets.POSTGRESQL_URL }}
          DB_URL: ${{ secrets.DB_URL }}
          NEON_DSN: ${{ secrets.NEON_DSN }}
          CONNECTION_STRING: ${{ secrets.CONNECTION_STRING }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || vars.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          GOOGLE_AI_KEY: ${{ secrets.GOOGLE_AI_KEY }}
          GEMINI_TOKEN: ${{ secrets.GEMINI_TOKEN }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          WAHA_SECRET: ${{ secrets.WAHA_SECRET || vars.WAHA_SECRET }}
          WAHA_APP_SECRET: ${{ secrets.WAHA_APP_SECRET }}
          APP_SECRET: ${{ secrets.APP_SECRET }}
          FLASK_SECRET: ${{ secrets.FLASK_SECRET }}
          WAHA_CSRF_SECRET: ${{ secrets.WAHA_CSRF_SECRET }}
          WAHA_ALLOWED_ORIGINS: ${{ secrets.WAHA_ALLOWED_ORIGINS || vars.WAHA_ALLOWED_ORIGINS }}
          ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS }}
          WAHA_ORIGINS: ${{ secrets.WAHA_ORIGINS }}
          CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN || vars.VERCEL_TOKEN }}
          VERCEL_API_TOKEN: ${{ secrets.VERCEL_API_TOKEN }}
          VERCEL_ACCESS_TOKEN: ${{ secrets.VERCEL_ACCESS_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID || vars.VERCEL_PROJECT_ID }}
          VERCEL_PROJECT_NAME: ${{ vars.VERCEL_PROJECT_NAME }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID || vars.VERCEL_TEAM_ID }}
          VERCEL_TEAM_SLUG: ${{ vars.VERCEL_TEAM_SLUG }}
          GITHUB_REPO_ID: ${{ github.event.repository.id }}
        run: |
          set -uo pipefail
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            scripts/vercel_env_sync.sh --dry-run 2>&1 | tee /tmp/sync.log
            status="${PIPESTATUS[0]}"
          else
            scripts/vercel_env_sync.sh 2>&1 | tee /tmp/sync.log
            status="${PIPESTATUS[0]}"
          fi
          echo "script-exit=$status"
          exit "$status"
        continue-on-error: true

      - name: Publish the report (step summary + annotations)
        if: always()
        run: |
          set -uo pipefail
          log=/tmp/sync.log
          [ -f "$log" ] || { echo "no log produced"; exit 0; }

          {
            echo "### Sync production keys to Vercel"
            echo
            echo '```text'
            head -c 6000 "$log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # GitHub keeps only ten warning annotations per step, so the report is
          # folded into three: which names were found, how they validated, and how
          # the run ended. Values never appear here -- the log is already redacted.
          keys="$(grep -E '^(DATABASE_URL|GEMINI_API_KEY|WAHA_SECRET|WAHA_ALLOWED_ORIGINS|VERCEL_TOKEN|VERCEL_PROJECT_ID|VERCEL_TEAM_ID) ' "$log" | paste -sd'|' -)"
          checks="$(grep -E '^(PASS|FAIL|WARN|MISS) ' "$log" | paste -sd'|' -)"
          ending="$(grep -E '^(Stopping:|Dry run|Sync finished|Add an Actions|script-exit=)' "$log" | paste -sd'|' -)"
          [ -n "$keys" ] && printf '::warning title=keys-found::%s\n' "$keys"
          [ -n "$checks" ] && printf '::warning title=validation::%s\n' "$checks"
          [ -n "$ending" ] && printf '::warning title=ending::%s\n' "$ending"

      - name: Fail the run when the script failed
        if: steps.sync.outcome == 'failure'
        run: |
          echo "The sync script reported a failure; see the report above."
          exit 1

  diagnose:
    # Read-only: reports which candidate NAMES exist (secret or variable), never a
    # value. Temporary -- it exists to discover what the operator actually named the
    # keys, so the sync job above can find them.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Production
    steps:
      - name: Which key names exist in the repository and the Production environment
        env:
          S_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          V_DATABASE_URL: ${{ vars.DATABASE_URL }}
          S_DATABASE_URL_POOLED: ${{ secrets.DATABASE_URL_POOLED }}
          V_DATABASE_URL_POOLED: ${{ vars.DATABASE_URL_POOLED }}
          S_NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          V_NEON_DATABASE_URL: ${{ vars.NEON_DATABASE_URL }}
          S_NEON_URL: ${{ secrets.NEON_URL }}
          V_NEON_URL: ${{ vars.NEON_URL }}
          S_NEON_DB_URL: ${{ secrets.NEON_DB_URL }}
          V_NEON_DB_URL: ${{ vars.NEON_DB_URL }}
          S_NEON: ${{ secrets.NEON }}
          V_NEON: ${{ vars.NEON }}
          S_POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          V_POSTGRES_URL: ${{ vars.POSTGRES_URL }}
          S_POSTGRESQL_URL: ${{ secrets.POSTGRESQL_URL }}
          V_POSTGRESQL_URL: ${{ vars.POSTGRESQL_URL }}
          S_POSTGRES_PRIVATE_URL: ${{ secrets.POSTGRES_PRIVATE_URL }}
          V_POSTGRES_PRIVATE_URL: ${{ vars.POSTGRES_PRIVATE_URL }}
          S_DATABASE_PRIVATE_URL: ${{ secrets.DATABASE_PRIVATE_URL }}
          V_DATABASE_PRIVATE_URL: ${{ vars.DATABASE_PRIVATE_URL }}
          S_DB_URL: ${{ secrets.DB_URL }}
          V_DB_URL: ${{ vars.DB_URL }}
          S_DSN: ${{ secrets.DSN }}
          V_DSN: ${{ vars.DSN }}
          S_CONNECTION_STRING: ${{ secrets.CONNECTION_STRING }}
          V_CONNECTION_STRING: ${{ vars.CONNECTION_STRING }}
          S_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          V_GEMINI_API_KEY: ${{ vars.GEMINI_API_KEY }}
          S_GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          V_GOOGLE_API_KEY: ${{ vars.GOOGLE_API_KEY }}
          S_GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          V_GEMINI_KEY: ${{ vars.GEMINI_KEY }}
          S_GOOGLE_GENAI_API_KEY: ${{ secrets.GOOGLE_GENAI_API_KEY }}
          V_GOOGLE_GENAI_API_KEY: ${{ vars.GOOGLE_GENAI_API_KEY }}
          S_GOOGLE_AI_STUDIO_API_KEY: ${{ secrets.GOOGLE_AI_STUDIO_API_KEY }}
          V_GOOGLE_AI_STUDIO_API_KEY: ${{ vars.GOOGLE_AI_STUDIO_API_KEY }}
          S_GEMINI: ${{ secrets.GEMINI }}
          V_GEMINI: ${{ vars.GEMINI }}
          S_WAHA_SECRET: ${{ secrets.WAHA_SECRET }}
          V_WAHA_SECRET: ${{ vars.WAHA_SECRET }}
          S_APP_SECRET: ${{ secrets.APP_SECRET }}
          V_APP_SECRET: ${{ vars.APP_SECRET }}
          S_WAHA_ALLOWED_ORIGINS: ${{ secrets.WAHA_ALLOWED_ORIGINS }}
          V_WAHA_ALLOWED_ORIGINS: ${{ vars.WAHA_ALLOWED_ORIGINS }}
          S_ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS }}
          V_ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS }}
          S_VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          V_VERCEL_TOKEN: ${{ vars.VERCEL_TOKEN }}
          S_VERCEL_API_TOKEN: ${{ secrets.VERCEL_API_TOKEN }}
          V_VERCEL_API_TOKEN: ${{ vars.VERCEL_API_TOKEN }}
          S_API_KEY: ${{ secrets.API_KEY }}
          V_API_KEY: ${{ vars.API_KEY }}
          S_SECRET: ${{ secrets.SECRET }}
          V_SECRET: ${{ vars.SECRET }}
          S_TOKEN: ${{ secrets.TOKEN }}
          V_TOKEN: ${{ vars.TOKEN }}
          S_PASSWORD: ${{ secrets.PASSWORD }}
          V_PASSWORD: ${{ vars.PASSWORD }}
          S_DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          V_DATABASE_PASSWORD: ${{ vars.DATABASE_PASSWORD }}
          S_database_url: ${{ secrets.database_url }}
          V_database_url: ${{ vars.database_url }}
          S_gemini_api_key: ${{ secrets.gemini_api_key }}
          V_gemini_api_key: ${{ vars.gemini_api_key }}
          S_waha_secret: ${{ secrets.waha_secret }}
          V_waha_secret: ${{ vars.waha_secret }}
          S_vercel_token: ${{ secrets.vercel_token }}
          V_vercel_token: ${{ vars.vercel_token }}
        run: |
          found=""
          for name in DATABASE_URL DATABASE_URL_POOLED NEON_DATABASE_URL NEON_URL NEON_DB_URL NEON POSTGRES_URL POSTGRESQL_URL POSTGRES_PRIVATE_URL DATABASE_PRIVATE_URL DB_URL DSN CONNECTION_STRING GEMINI_API_KEY GOOGLE_API_KEY GEMINI_KEY GOOGLE_GENAI_API_KEY GOOGLE_AI_STUDIO_API_KEY GEMINI WAHA_SECRET APP_SECRET WAHA_ALLOWED_ORIGINS ALLOWED_ORIGINS VERCEL_TOKEN VERCEL_API_TOKEN API_KEY SECRET TOKEN PASSWORD DATABASE_PASSWORD database_url gemini_api_key waha_secret vercel_token; do
            s="S_$name"; v="V_$name"
            if [ -n "${!s}" ]; then found="$found $name(secret)"; fi
            if [ -n "${!v}" ]; then found="$found $name(variable)"; fi
          done
          echo "::warning title=names-found::$(printf '%s' "${found:-none of the candidate names are set in the repo or Production scope}")"

  diagnose-preview:
    # The other environment the operator might have used.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Preview
    steps:
      - name: Which key names exist in the Preview environment
        env:
          S_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          V_DATABASE_URL: ${{ vars.DATABASE_URL }}
          S_DATABASE_URL_POOLED: ${{ secrets.DATABASE_URL_POOLED }}
          V_DATABASE_URL_POOLED: ${{ vars.DATABASE_URL_POOLED }}
          S_NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          V_NEON_DATABASE_URL: ${{ vars.NEON_DATABASE_URL }}
          S_NEON_URL: ${{ secrets.NEON_URL }}
          V_NEON_URL: ${{ vars.NEON_URL }}
          S_NEON_DB_URL: ${{ secrets.NEON_DB_URL }}
          V_NEON_DB_URL: ${{ vars.NEON_DB_URL }}
          S_NEON: ${{ secrets.NEON }}
          V_NEON: ${{ vars.NEON }}
          S_POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          V_POSTGRES_URL: ${{ vars.POSTGRES_URL }}
          S_POSTGRESQL_URL: ${{ secrets.POSTGRESQL_URL }}
          V_POSTGRESQL_URL: ${{ vars.POSTGRESQL_URL }}
          S_POSTGRES_PRIVATE_URL: ${{ secrets.POSTGRES_PRIVATE_URL }}
          V_POSTGRES_PRIVATE_URL: ${{ vars.POSTGRES_PRIVATE_URL }}
          S_DATABASE_PRIVATE_URL: ${{ secrets.DATABASE_PRIVATE_URL }}
          V_DATABASE_PRIVATE_URL: ${{ vars.DATABASE_PRIVATE_URL }}
          S_DB_URL: ${{ secrets.DB_URL }}
          V_DB_URL: ${{ vars.DB_URL }}
          S_DSN: ${{ secrets.DSN }}
          V_DSN: ${{ vars.DSN }}
          S_CONNECTION_STRING: ${{ secrets.CONNECTION_STRING }}
          V_CONNECTION_STRING: ${{ vars.CONNECTION_STRING }}
          S_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          V_GEMINI_API_KEY: ${{ vars.GEMINI_API_KEY }}
          S_GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          V_GOOGLE_API_KEY: ${{ vars.GOOGLE_API_KEY }}
          S_GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          V_GEMINI_KEY: ${{ vars.GEMINI_KEY }}
          S_GOOGLE_GENAI_API_KEY: ${{ secrets.GOOGLE_GENAI_API_KEY }}
          V_GOOGLE_GENAI_API_KEY: ${{ vars.GOOGLE_GENAI_API_KEY }}
          S_GOOGLE_AI_STUDIO_API_KEY: ${{ secrets.GOOGLE_AI_STUDIO_API_KEY }}
          V_GOOGLE_AI_STUDIO_API_KEY: ${{ vars.GOOGLE_AI_STUDIO_API_KEY }}
          S_GEMINI: ${{ secrets.GEMINI }}
          V_GEMINI: ${{ vars.GEMINI }}
          S_WAHA_SECRET: ${{ secrets.WAHA_SECRET }}
          V_WAHA_SECRET: ${{ vars.WAHA_SECRET }}
          S_APP_SECRET: ${{ secrets.APP_SECRET }}
          V_APP_SECRET: ${{ vars.APP_SECRET }}
          S_WAHA_ALLOWED_ORIGINS: ${{ secrets.WAHA_ALLOWED_ORIGINS }}
          V_WAHA_ALLOWED_ORIGINS: ${{ vars.WAHA_ALLOWED_ORIGINS }}
          S_ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS }}
          V_ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS }}
          S_VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          V_VERCEL_TOKEN: ${{ vars.VERCEL_TOKEN }}
          S_VERCEL_API_TOKEN: ${{ secrets.VERCEL_API_TOKEN }}
          V_VERCEL_API_TOKEN: ${{ vars.VERCEL_API_TOKEN }}
          S_API_KEY: ${{ secrets.API_KEY }}
          V_API_KEY: ${{ vars.API_KEY }}
          S_SECRET: ${{ secrets.SECRET }}
          V_SECRET: ${{ vars.SECRET }}
          S_TOKEN: ${{ secrets.TOKEN }}
          V_TOKEN: ${{ vars.TOKEN }}
          S_PASSWORD: ${{ secrets.PASSWORD }}
          V_PASSWORD: ${{ vars.PASSWORD }}
          S_DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          V_DATABASE_PASSWORD: ${{ vars.DATABASE_PASSWORD }}
          S_database_url: ${{ secrets.database_url }}
          V_database_url: ${{ vars.database_url }}
          S_gemini_api_key: ${{ secrets.gemini_api_key }}
          V_gemini_api_key: ${{ vars.gemini_api_key }}
          S_waha_secret: ${{ secrets.waha_secret }}
          V_waha_secret: ${{ vars.waha_secret }}
          S_vercel_token: ${{ secrets.vercel_token }}
          V_vercel_token: ${{ vars.vercel_token }}
        run: |
          found=""
          for name in DATABASE_URL DATABASE_URL_POOLED NEON_DATABASE_URL NEON_URL NEON_DB_URL NEON POSTGRES_URL POSTGRESQL_URL POSTGRES_PRIVATE_URL DATABASE_PRIVATE_URL DB_URL DSN CONNECTION_STRING GEMINI_API_KEY GOOGLE_API_KEY GEMINI_KEY GOOGLE_GENAI_API_KEY GOOGLE_AI_STUDIO_API_KEY GEMINI WAHA_SECRET APP_SECRET WAHA_ALLOWED_ORIGINS ALLOWED_ORIGINS VERCEL_TOKEN VERCEL_API_TOKEN API_KEY SECRET TOKEN PASSWORD DATABASE_PASSWORD database_url gemini_api_key waha_secret vercel_token; do
            s="S_$name"; v="V_$name"
            if [ -n "${!s}" ]; then found="$found $name(secret)"; fi
            if [ -n "${!v}" ]; then found="$found $name(variable)"; fi
          done
          echo "::warning title=names-found-preview::$(printf '%s' "${found:-none}")"
