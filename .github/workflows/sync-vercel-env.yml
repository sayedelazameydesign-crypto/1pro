name: Sync production keys to Vercel

# The operator keeps the deployment keys in GitHub, but production runs on Vercel,
# and Vercel cannot read GitHub secrets. This workflow is the bridge: a runner is
# the only place GitHub exposes secret *values*, so it reads them there, validates
# every one of them, writes them into the Vercel project as Production variables,
# redeploys, and verifies the live service. It never prints a value: the script it
# calls redacts every line it emits (see scripts/vercel_env_sync.sh).
#
# Nothing of the repository is modified. Run it by hand: Actions -> Sync production
# keys to Vercel -> Run workflow. Documented in DEPLOY-VERCEL.md -> "المفاتيح".
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate the secrets only; change nothing on Vercel"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sync-vercel-env
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Declaring the environment means the job also sees secrets and variables that
    # were attached to the "Production" environment instead of the repository.
    environment: Production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install psycopg so the database URL is proven by a live query
        run: python -m pip install --quiet "psycopg[binary]~=3.2"

      - name: Flag any key stored as a variable instead of a secret
        env:
          # Presence only: nothing here prints a value.
          V_DATABASE_URL: ${{ vars.DATABASE_URL }}
          V_GEMINI_API_KEY: ${{ vars.GEMINI_API_KEY }}
          V_WAHA_SECRET: ${{ vars.WAHA_SECRET }}
          V_VERCEL_TOKEN: ${{ vars.VERCEL_TOKEN }}
          V_NEON_API_KEY: ${{ vars.NEON_API_KEY }}
        run: |
          for name in DATABASE_URL GEMINI_API_KEY WAHA_SECRET VERCEL_TOKEN NEON_API_KEY; do
            key="V_$name"
            if [ -n "${!key:-}" ]; then
              echo "::warning title=variable::$name is set as a repository or environment VARIABLE. This repository is public, so its variables are readable by anyone -- move $name to Actions secrets (and delete the variable)."
            fi
          done

      - name: Read GitHub secrets, push them to Vercel, verify production
        id: sync
        env:
          # Every alias is tried in order; the first non-empty one wins. `vars.*`
          # is the fallback for a key that was stored as a repository/environment
          # *variable* instead of a secret (secrets are the safer place).
          # `secrets.X || vars.X`: a key stored as a repository/environment
          # *variable* still works, and the step below says so out loud. Either
          # way the value must be non-empty for the name to be reported as found.
          DATABASE_URL: ${{ secrets.DATABASE_URL || vars.DATABASE_URL }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL || vars.NEON_DATABASE_URL }}
          DATABASE_PRIVATE_URL: ${{ secrets.DATABASE_PRIVATE_URL }}
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          POSTGRES_PRISMA_URL: ${{ secrets.POSTGRES_PRISMA_URL }}
          POSTGRES_URL_NON_POOLING: ${{ secrets.POSTGRES_URL_NON_POOLING }}
          NEON_POSTGRES_URL: ${{ secrets.NEON_POSTGRES_URL }}
          NEON_URL: ${{ secrets.NEON_URL }}
          NEON_CONNECTION_STRING: ${{ secrets.NEON_CONNECTION_STRING }}
          DATABASE_CONNECTION_STRING: ${{ secrets.DATABASE_CONNECTION_STRING }}
          WAHA_DATABASE_URL: ${{ secrets.WAHA_DATABASE_URL }}
          POSTGRESQL_URL: ${{ secrets.POSTGRESQL_URL }}
          DB_URL: ${{ secrets.DB_URL }}
          NEON_DSN: ${{ secrets.NEON_DSN }}
          CONNECTION_STRING: ${{ secrets.CONNECTION_STRING }}
          # A Neon API key is not a connection string, but it can produce one: the
          # script derives the pooled URL from it when DATABASE_URL is absent or is not
          # a Postgres URL, then proves it with the same live query. See DEPLOY-VERCEL.md.
          NEON_API_KEY: ${{ secrets.NEON_API_KEY || vars.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID || vars.NEON_PROJECT_ID }}
          NEON_ROLE: ${{ vars.NEON_ROLE }}
          NEON_DATABASE: ${{ vars.NEON_DATABASE }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || vars.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          GOOGLE_AI_KEY: ${{ secrets.GOOGLE_AI_KEY }}
          GEMINI_TOKEN: ${{ secrets.GEMINI_TOKEN }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          WAHA_SECRET: ${{ secrets.WAHA_SECRET || vars.WAHA_SECRET }}
          WAHA_APP_SECRET: ${{ secrets.WAHA_APP_SECRET }}
          APP_SECRET: ${{ secrets.APP_SECRET }}
          FLASK_SECRET: ${{ secrets.FLASK_SECRET }}
          WAHA_CSRF_SECRET: ${{ secrets.WAHA_CSRF_SECRET }}
          WAHA_ALLOWED_ORIGINS: ${{ secrets.WAHA_ALLOWED_ORIGINS || vars.WAHA_ALLOWED_ORIGINS }}
          ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS }}
          WAHA_ORIGINS: ${{ secrets.WAHA_ORIGINS }}
          CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}
          # Secrets only: a Vercel token stored as a variable is readable by anyone with
          # repository access, so there is deliberately no `vars.` fallback here. The
          # step above warns when the token is still stored as a variable.
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_API_TOKEN: ${{ secrets.VERCEL_API_TOKEN }}
          VERCEL_ACCESS_TOKEN: ${{ secrets.VERCEL_ACCESS_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID || vars.VERCEL_PROJECT_ID }}
          VERCEL_PROJECT_NAME: ${{ vars.VERCEL_PROJECT_NAME }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID || vars.VERCEL_TEAM_ID }}
          VERCEL_TEAM_SLUG: ${{ vars.VERCEL_TEAM_SLUG }}
          GITHUB_REPO_ID: ${{ github.event.repository.id }}
        run: |
          set -uo pipefail
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            scripts/vercel_env_sync.sh --dry-run 2>&1 | tee /tmp/sync.log
            status="${PIPESTATUS[0]}"
          else
            scripts/vercel_env_sync.sh 2>&1 | tee /tmp/sync.log
            status="${PIPESTATUS[0]}"
          fi
          echo "script-exit=$status"
          exit "$status"
        continue-on-error: true

      - name: Publish the report (step summary + annotations)
        if: always()
        run: |
          set -uo pipefail
          log=/tmp/sync.log
          [ -f "$log" ] || { echo "no log produced"; exit 0; }

          {
            echo "### Sync production keys to Vercel"
            echo
            echo '```text'
            head -c 6000 "$log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # GitHub keeps only ten warning annotations per step, so the report is
          # folded into three: which names were found, how they validated, and how
          # the run ended. Values never appear here -- the log is already redacted.
          keys="$(grep -E '^(DATABASE_URL|GEMINI_API_KEY|WAHA_SECRET|WAHA_ALLOWED_ORIGINS|VERCEL_TOKEN|VERCEL_PROJECT_ID|VERCEL_TEAM_ID) ' "$log" | paste -sd'|' -)"
          checks="$(grep -E '^(PASS|FAIL|WARN|MISS) ' "$log" | paste -sd'|' -)"
          ending="$(grep -E '^(Stopping:|Dry run|Sync finished|Add an Actions|script-exit=)' "$log" | paste -sd'|' -)"
          [ -n "$keys" ] && printf '::warning title=keys-found::%s\n' "$keys"
          [ -n "$checks" ] && printf '::warning title=validation::%s\n' "$checks"
          [ -n "$ending" ] && printf '::warning title=ending::%s\n' "$ending"

      - name: Fail the run when the script failed
        if: steps.sync.outcome == 'failure'
        run: |
          echo "The sync script reported a failure; see the report above."
          exit 1
