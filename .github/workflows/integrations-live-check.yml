name: Integrations live check (read-only, temporary)

# Temporary operator tool, sibling of prod-probe.yml and db-check.yml. The agent's
# sandbox can read GitHub, but it cannot reach api.vercel.com (its egress allow-list
# covers github.com only) and it cannot read repository secrets (403). So "does the
# Vercel token stored in this repository actually work, and for which project?" is
# unanswerable from there, and a runner is the only place that can answer it.
#
# READ-ONLY. It runs `scripts/integrations_live_check.py` WITHOUT --allow-mutations,
# so no workflow is dispatched and no production deployment is triggered; the two
# write checks report SKIP and are expected to. The probes are GETs.
#
# Why the checker runs twice:
#   A) exactly as the operator's stored configuration describes it -- the token, the
#      configured VERCEL_TEAM_ID, and the discovered project id. This is the verdict
#      that matters: it is what production would get.
#   B) with the team filter dropped. Diagnostic only. If A is 403 and B passes, the
#      credential is fine and the *scope* is wrong -- the failure the mocked layers
#      structurally cannot see, and the reason this checker exists.
# Neither run is allowed to borrow the other's result.
#
# Output channel: the raw log is served from a host the sandbox cannot read, so every
# finding is republished as a check-run annotation, as prod-probe.yml does. The
# checker redacts its own transcript, and Actions masks every value from `secrets.`.
#
# Delete this file once the answer is known: it is not part of the product.
on:
  push:
    paths:
      - ".github/workflows/integrations-live-check.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read          # the GitHub read check lists this repository's workflow runs

concurrency:
  group: integrations-live-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # The GitHub half is already verified from the sandbox with the owner's own
      # credential; here it runs so the same report covers both providers. A secret
      # cannot be named GITHUB_TOKEN (reserved prefix), so the runner's own token is
      # the right value -- it proves the read path, though not the operator's PAT.
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_REPO: ${{ github.repository }}
      GITHUB_WORKFLOW_ID: ci.yml
      # Every alias scripts/vercel_env_sync.sh knows, in its order. First non-empty wins.
      ALIAS_VERCEL_TOKEN_1: ${{ secrets.VERCEL_TOKEN || vars.VERCEL_TOKEN }}
      ALIAS_VERCEL_TOKEN_2: ${{ secrets.VERCEL_API_TOKEN }}
      ALIAS_VERCEL_TOKEN_3: ${{ secrets.VERCEL_ACCESS_TOKEN }}
      ALIAS_VERCEL_PROJECT_ID_1: ${{ secrets.VERCEL_PROJECT_ID || vars.VERCEL_PROJECT_ID }}
      ALIAS_VERCEL_PROJECT_ID_2: ${{ secrets.VERCEL_PROJECT_NAME || vars.VERCEL_PROJECT_NAME }}
      ALIAS_VERCEL_TEAM_ID_1: ${{ secrets.VERCEL_TEAM_ID || vars.VERCEL_TEAM_ID }}
      ALIAS_VERCEL_TEAM_ID_2: ${{ vars.VERCEL_TEAM_SLUG || secrets.VERCEL_TEAM_SLUG }}
      ALIAS_DEPLOY_HOOK_URL_1: ${{ secrets.DEPLOY_HOOK_URL || vars.DEPLOY_HOOK_URL }}
      ALIAS_DEPLOY_HOOK_URL_2: ${{ secrets.VERCEL_DEPLOY_HOOK_URL || vars.VERCEL_DEPLOY_HOOK_URL }}
      ALIAS_WAHA_OWNER_TOKEN_1: ${{ secrets.WAHA_OWNER_TOKEN || vars.WAHA_OWNER_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      # Names only, never values: so a SKIP can be attributed to a specific missing
      # variable instead of a guess. Mirrors the naming report in
      # scripts/vercel_env_sync.sh.
      - name: Resolve credentials by name (booleans only)
        id: resolve
        run: |
          set -uo pipefail
          : > /tmp/names.txt
          pick() { # logical_name, then alias values in preference order
            local name="$1"; shift
            local i=0
            for candidate in "$@"; do
              i=$((i + 1))
              if [ -n "$candidate" ]; then
                printf '%-22s present  <- alias #%s\n' "$name" "$i" >> /tmp/names.txt
                printf '%s=%s\n' "$name" "$candidate" >> "$GITHUB_ENV"
                return 0
              fi
            done
            printf '%-22s MISSING  (%s alias slots all empty)\n' "$name" "$i" >> /tmp/names.txt
            return 0
          }
          pick VERCEL_TOKEN "${ALIAS_VERCEL_TOKEN_1:-}" "${ALIAS_VERCEL_TOKEN_2:-}" "${ALIAS_VERCEL_TOKEN_3:-}"
          pick VERCEL_PROJECT_ID "${ALIAS_VERCEL_PROJECT_ID_1:-}" "${ALIAS_VERCEL_PROJECT_ID_2:-}"
          pick VERCEL_TEAM_ID "${ALIAS_VERCEL_TEAM_ID_1:-}" "${ALIAS_VERCEL_TEAM_ID_2:-}"
          pick DEPLOY_HOOK_URL "${ALIAS_DEPLOY_HOOK_URL_1:-}" "${ALIAS_DEPLOY_HOOK_URL_2:-}"
          pick WAHA_OWNER_TOKEN "${ALIAS_WAHA_OWNER_TOKEN_1:-}"
          cat /tmp/names.txt
          printf '::warning title=credential-names::%s\n' "$(paste -sd'|' /tmp/names.txt)"

      # The token is the credential under test, so it is probed directly before it is
      # handed to the checker. /v2/user is scope-free: it proves the credential is
      # alive, so any later 403 can be attributed to scope rather than to a dead
      # token. Every probe reports a status code and Vercel's own error code; the
      # token itself is never printed.
      - name: Probe the Vercel token's validity and scope
        id: discover
        run: |
          set -uo pipefail
          : > /tmp/probe.txt
          note() { printf '%s|' "$*" >> /tmp/probe.txt; printf '%s\n' "$*"; }
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            note "VERCEL_TOKEN absent: nothing to probe"
            exit 0
          fi
          q() { python3 -c 'import sys,urllib.parse;print(urllib.parse.quote(sys.argv[1],safe=""))' "$1"; }

          probe() { # label url outfile
            local label="$1" url="$2" out="$3" code summary
            code="$(curl -sS -o "$out" -w '%{http_code}' --max-time 30 \
                      -H "Authorization: Bearer $VERCEL_TOKEN" "$url" || echo 000)"
            summary="$(jq -r '
              [ (if (.error|type) == "object" then (.error.message // .error.code)
                 elif .error then (.error|tostring) else empty end),
                (if .user.username then "user=" + .user.username else empty end),
                (if (.teams|type) == "array" then "teams=" + ([.teams[]? | (.slug//"?") + "=" + .id] | join(",")) else empty end),
                (if (.projects|type) == "array" then "projects=" + ([.projects[]? | .name] | join(",")) else empty end),
                (if (.deployments|type) == "array" then "deployments=" + ([.deployments[]? | .name] | unique | join(",")) else empty end)
              ] | map(select(. != null and . != "")) | join(" ")' "$out" 2>/dev/null)"
            note "$label http=$code ${summary:-(no body)}"
          }

          note "configured VERCEL_TEAM_ID present=$([ -n "${VERCEL_TEAM_ID:-}" ] && echo yes || echo no)"
          probe "GET /v2/user"                            "https://api.vercel.com/v2/user"                    /tmp/p_user.json
          probe "GET /v2/teams"                           "https://api.vercel.com/v2/teams?limit=20"          /tmp/p_teams.json
          probe "GET /v9/projects (personal scope)"       "https://api.vercel.com/v9/projects?limit=20"       /tmp/p_projects_personal.json
          probe "GET /v6/deployments (personal scope)"    "https://api.vercel.com/v6/deployments?limit=3"     /tmp/p_deployments_personal.json

          # The canonical id of the team the token *can* see, taken from /v2/teams.
          # If the configured value 403s and this one 403s too, the configured value
          # was never the problem -- the token's scope is.
          canon="$(jq -r '.teams[]?.id' /tmp/p_teams.json 2>/dev/null | head -1)"
          if [ -n "$canon" ]; then
            probe "GET /v9/projects (canonical team)"     "https://api.vercel.com/v9/projects?limit=20&teamId=$(q "$canon")" /tmp/p_projects_canon.json
          fi
          if [ -n "${VERCEL_TEAM_ID:-}" ]; then
            probe "GET /v9/projects (configured team)"    "https://api.vercel.com/v9/projects?limit=20&teamId=$(q "$VERCEL_TEAM_ID")" /tmp/p_projects_teamconf.json
            probe "GET /v6/deployments (configured team)" "https://api.vercel.com/v6/deployments?limit=3&teamId=$(q "$VERCEL_TEAM_ID")" /tmp/p_deployments_teamconf.json
          fi

          # The id of the production project, from the only scope that answered. Held
          # separately from VERCEL_PROJECT_ID so run A can be told what the operator
          # would have to store, without this file pretending it was stored.
          chosen="$(jq -r '.projects[]? | select(.name == "cela" or .name == "cela-umber" or .name == "1pro") | .id' /tmp/p_projects_personal.json 2>/dev/null | head -1)"
          [ -n "$chosen" ] || chosen="$(jq -r '.projects[0]?.id // empty' /tmp/p_projects_personal.json 2>/dev/null)"
          {
            printf 'DISCOVERED_PROJECT_ID=%s\n' "$chosen"
            printf 'DISCOVERED_PROJECT_NAME=%s\n' "$(jq -r '.projects[]? | select(.name == "cela") | .name' /tmp/p_projects_personal.json 2>/dev/null | head -1)"
            printf 'CANONICAL_TEAM_ID=%s\n' "$canon"
          } >> "$GITHUB_ENV"
          note "discovered project id for the personal-scope 'cela': ${chosen:-none}; canonical team id: ${canon:-none}"

      # Proves the checker before trusting its verdict, exactly as CI does.
      - name: Self-test the checker offline first
        run: python scripts/integrations_live_check.py --self-test

      # Verdict A: what the operator's stored configuration yields, plus the project
      # id discovery found. This is the line that decides the run.
      - name: Run A -- as configured (token + VERCEL_TEAM_ID + discovered project)
        id: runA
        continue-on-error: true
        env:
          VERCEL_PROJECT_ID: ${{ env.DISCOVERED_PROJECT_ID }}
        run: |
          set -uo pipefail
          status=0
          python scripts/integrations_live_check.py > /tmp/liveA.txt 2> /tmp/liveA.err || status=$?
          printf '%s\n' "$status" > /tmp/liveA.status
          sed 's/^/A| /' /tmp/liveA.txt
          cat /tmp/liveA.err

      # Diagnostic B: the same credential, team filter dropped. Never overwrites A.
      - name: Run B -- diagnostic (team filter dropped)
        id: runB
        continue-on-error: true
        env:
          VERCEL_PROJECT_ID: ${{ env.DISCOVERED_PROJECT_ID }}
          VERCEL_TEAM_ID: ""
        run: |
          set -uo pipefail
          status=0
          python scripts/integrations_live_check.py > /tmp/liveB.txt 2> /tmp/liveB.err || status=$?
          printf '%s\n' "$status" > /tmp/liveB.status
          sed 's/^/B| /' /tmp/liveB.txt
          cat /tmp/liveB.err

      - name: Publish findings as annotations (the only channel readable remotely)
        if: always()
        run: |
          set -uo pipefail
          echo "--- scope probes ---"; cat /tmp/probe.txt 2>/dev/null || true
          echo; echo "--- run A (as configured) ---"; cat /tmp/liveA.txt 2>/dev/null || true
          echo; echo "--- run B (team filter dropped) ---"; cat /tmp/liveB.txt 2>/dev/null || true
          printf '::warning title=scope-probes::%s\n' "$(head -c 1800 /tmp/probe.txt 2>/dev/null)"
          printf '::warning title=run-A-as-configured-exit%s::%s\n' "$(cat /tmp/liveA.status 2>/dev/null)" "$(tr '\n' '|' < /tmp/liveA.txt 2>/dev/null | head -c 1500)"
          printf '::warning title=run-B-team-filter-dropped-exit%s::%s\n' "$(cat /tmp/liveB.status 2>/dev/null)" "$(tr '\n' '|' < /tmp/liveB.txt 2>/dev/null | head -c 1500)"
          printf '::warning title=run-A-stderr::%s\n' "$(tr '\n' '|' < /tmp/liveA.err 2>/dev/null | head -c 500)"
          printf '::warning title=run-B-stderr::%s\n' "$(tr '\n' '|' < /tmp/liveB.err 2>/dev/null | head -c 500)"

      # A decides the run: if the operator's own scope cannot read, the configuration
      # needs a change, and a green checkmark here would hide exactly that.
      - name: Fail when run A (the configured scope) did not pass
        run: |
          set -uo pipefail
          a="$(cat /tmp/liveA.status 2>/dev/null || echo 9)"
          b="$(cat /tmp/liveB.status 2>/dev/null || echo 9)"
          echo "run A exit=$a  run B exit=$b"
          if [ "$a" = 0 ]; then
            echo "run A passed: the configured integration verifies end to end"
            exit 0
          fi
          if [ "$b" = 0 ]; then
            echo "run A failed but run B passed: the credential works and the configured"
            echo "scope does not -- VERCEL_TEAM_ID is the variable to fix, or the token"
            echo "must be re-minted inside that team instead of the personal account."
            exit 1
          fi
          echo "neither run reached Vercel (A=$a, B=$b)"
          exit 1
