name: Key names probe (temporary, read-only)

# TEMPORARY diagnostic. The operator added deployment keys to GitHub, the sync
# job cannot find them under the names it knows, and this repository's public API
# token cannot list secret names. This workflow therefore reports which candidate
# NAMES exist -- secret or variable, repository or environment scope -- and never
# a value. Delete it once the names are known.
on:
  push:
    branches:
      - arena/79021108-1pro
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-names:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Production
    steps:
      - name: Which names exist (repository + Production scope)
        env:
          S_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          S_DATABASE_URL_POOLED: ${{ secrets.DATABASE_URL_POOLED }}
          S_NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          S_NEON_URL: ${{ secrets.NEON_URL }}
          S_NEON_DB_URL: ${{ secrets.NEON_DB_URL }}
          S_NEON: ${{ secrets.NEON }}
          S_POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          S_POSTGRESQL_URL: ${{ secrets.POSTGRESQL_URL }}
          S_POSTGRES_PRIVATE_URL: ${{ secrets.POSTGRES_PRIVATE_URL }}
          S_DATABASE_PRIVATE_URL: ${{ secrets.DATABASE_PRIVATE_URL }}
          S_DB_URL: ${{ secrets.DB_URL }}
          S_DSN: ${{ secrets.DSN }}
          S_CONNECTION_STRING: ${{ secrets.CONNECTION_STRING }}
          S_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          S_GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          S_GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          S_GOOGLE_GENAI_API_KEY: ${{ secrets.GOOGLE_GENAI_API_KEY }}
          S_GOOGLE_AI_STUDIO_API_KEY: ${{ secrets.GOOGLE_AI_STUDIO_API_KEY }}
          S_GEMINI: ${{ secrets.GEMINI }}
          S_WAHA_SECRET: ${{ secrets.WAHA_SECRET }}
          S_APP_SECRET: ${{ secrets.APP_SECRET }}
          S_WAHA_ALLOWED_ORIGINS: ${{ secrets.WAHA_ALLOWED_ORIGINS }}
          S_ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS }}
          S_VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          S_VERCEL_API_TOKEN: ${{ secrets.VERCEL_API_TOKEN }}
          S_API_KEY: ${{ secrets.API_KEY }}
          S_SECRET: ${{ secrets.SECRET }}
          S_TOKEN: ${{ secrets.TOKEN }}
          S_PASSWORD: ${{ secrets.PASSWORD }}
          S_DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          S_KEY: ${{ secrets.KEY }}
          S_PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          V_DATABASE_URL: ${{ vars.DATABASE_URL }}
          V_DATABASE_URL_POOLED: ${{ vars.DATABASE_URL_POOLED }}
          V_NEON_DATABASE_URL: ${{ vars.NEON_DATABASE_URL }}
          V_NEON_URL: ${{ vars.NEON_URL }}
          V_NEON_DB_URL: ${{ vars.NEON_DB_URL }}
          V_NEON: ${{ vars.NEON }}
          V_POSTGRES_URL: ${{ vars.POSTGRES_URL }}
          V_POSTGRESQL_URL: ${{ vars.POSTGRESQL_URL }}
          V_POSTGRES_PRIVATE_URL: ${{ vars.POSTGRES_PRIVATE_URL }}
          V_DATABASE_PRIVATE_URL: ${{ vars.DATABASE_PRIVATE_URL }}
          V_DB_URL: ${{ vars.DB_URL }}
          V_DSN: ${{ vars.DSN }}
          V_CONNECTION_STRING: ${{ vars.CONNECTION_STRING }}
          V_GEMINI_API_KEY: ${{ vars.GEMINI_API_KEY }}
          V_GOOGLE_API_KEY: ${{ vars.GOOGLE_API_KEY }}
          V_GEMINI_KEY: ${{ vars.GEMINI_KEY }}
          V_GOOGLE_GENAI_API_KEY: ${{ vars.GOOGLE_GENAI_API_KEY }}
          V_GOOGLE_AI_STUDIO_API_KEY: ${{ vars.GOOGLE_AI_STUDIO_API_KEY }}
          V_GEMINI: ${{ vars.GEMINI }}
          V_WAHA_SECRET: ${{ vars.WAHA_SECRET }}
          V_APP_SECRET: ${{ vars.APP_SECRET }}
          V_WAHA_ALLOWED_ORIGINS: ${{ vars.WAHA_ALLOWED_ORIGINS }}
          V_ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS }}
          V_VERCEL_TOKEN: ${{ vars.VERCEL_TOKEN }}
          V_VERCEL_API_TOKEN: ${{ vars.VERCEL_API_TOKEN }}
          V_API_KEY: ${{ vars.API_KEY }}
          V_SECRET: ${{ vars.SECRET }}
          V_TOKEN: ${{ vars.TOKEN }}
          V_PASSWORD: ${{ vars.PASSWORD }}
          V_DATABASE_PASSWORD: ${{ vars.DATABASE_PASSWORD }}
          V_KEY: ${{ vars.KEY }}
          V_PROD_DATABASE_URL: ${{ vars.PROD_DATABASE_URL }}
          P_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          F_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || vars.GEMINI_API_KEY }}
          P_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          F_DATABASE_URL: ${{ secrets.DATABASE_URL || vars.DATABASE_URL }}
          P_VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          F_VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN || vars.VERCEL_TOKEN }}
        run: |
          found=""
          for name in DATABASE_URL DATABASE_URL_POOLED NEON_DATABASE_URL NEON_URL NEON_DB_URL NEON POSTGRES_URL POSTGRESQL_URL POSTGRES_PRIVATE_URL DATABASE_PRIVATE_URL DB_URL DSN CONNECTION_STRING GEMINI_API_KEY GOOGLE_API_KEY GEMINI_KEY GOOGLE_GENAI_API_KEY GOOGLE_AI_STUDIO_API_KEY GEMINI WAHA_SECRET APP_SECRET WAHA_ALLOWED_ORIGINS ALLOWED_ORIGINS VERCEL_TOKEN VERCEL_API_TOKEN API_KEY SECRET TOKEN PASSWORD DATABASE_PASSWORD KEY PROD_DATABASE_URL; do
            s="S_$name"; v="V_$name"
            if [ -n "${!s}" ]; then found="$found $name(secret)"; fi
            if [ -n "${!v}" ]; then found="$found $name(variable)"; fi
          done
          echo "::warning title=names-found::$(printf '%s' "${found:-none of the candidate names are set in the repo or Production scope}")"
          ab=""
          for name in GEMINI_API_KEY DATABASE_URL VERCEL_TOKEN; do
            p="P_$name"; f="F_$name"
            plain="unset"; orred="unset"
            [ -n "${!p}" ] && plain="set"
            [ -n "${!f}" ] && orred="set"
            ab="$ab $name:plain=$plain,with-or=$orred"
          done
          echo "::warning title=or-operator-check::$ab"

