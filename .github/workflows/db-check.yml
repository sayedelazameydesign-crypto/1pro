name: Database check (read-only, temporary)

# Temporary operator tool, sibling of prod-probe.yml. The agent's sandbox cannot read
# repository secrets (403) and cannot reach neon.tech, so "is the value the operator
# stored in DATABASE_URL actually a working pooled Neon URL?" cannot be answered from
# there. A runner can read the secret and reach Neon.
#
# Read-only against the database: SELECT 1, version(), current_database(), a table count.
# No writes anywhere, no Vercel, no deployment.
#
# The value itself is never printed. What is printed is derived structure only: lengths,
# presence booleans, and a skeleton in which every alphanumeric becomes `a` and the
# user:password part is already replaced by ***. Error text is masked the same way.
#
# Delete this file once the answer is known: it is not part of the product.
on:
  push:
    paths:
      - ".github/workflows/db-check.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DSN: ${{ secrets.DATABASE_URL }}
      SESSION_SECRET: ${{ secrets.WAHA_SECRET }}
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet "psycopg[binary]~=3.2"

      - name: Structure of the stored value, never the value
        run: |
          set -uo pipefail
          python3 - <<'PY' 2>&1 | tee /tmp/shape.txt
          import os
          import re

          value = os.environ.get("DSN", "")
          if not value:
              print("MISSING: no DATABASE_URL secret is visible in this job")
              raise SystemExit(0)

          print(f"length = {len(value)}")
          print(f"leading whitespace  = {value != value.lstrip()}")
          print(f"trailing whitespace = {value != value.rstrip()}")
          print(f"contains newline/tab = {any(c in value for c in chr(10) + chr(13) + chr(9))}")
          print(f"wrapped in double quotes = {len(value) >= 2 and value[0] == chr(34) and value[-1] == chr(34)}")
          print(f"wrapped in single quotes = {len(value) >= 2 and value[0] == chr(39) and value[-1] == chr(39)}")
          for token in ("postgres://", "postgresql://", "DATABASE_URL=", "sslmode=", "-pooler",
                        "neon", "https://", "@", "?", "=", " ", "[", "]"):
              print(f"contains {token!r} = {token in value}")
          print(f"only [A-Za-z0-9_-] = {bool(re.fullmatch(r'[A-Za-z0-9_-]+', value))}")

          masked = re.sub(r"://[^@/\s]*@", "://***@", value)
          skeleton = re.sub(r"[A-Za-z0-9]", "a", masked)
          print(f"skeleton = {skeleton[:120]}")
          PY

      - name: Presence of the session secret
        run: |
          set -uo pipefail
          if [ -z "${SESSION_SECRET:-}" ]; then
            echo "WAHA_SECRET: MISSING (sessions drop on every container recycle)" | tee /tmp/session.txt
          else
            echo "WAHA_SECRET: present, length=${#SESSION_SECRET} (needs >= 16)" | tee /tmp/session.txt
          fi

      - name: Live query, raw then trimmed
        run: |
          set -uo pipefail
          python3 - <<'PY' 2>&1 | tee /tmp/live.txt
          import os
          import re
          import time

          import psycopg


          def masked(text):
              return re.sub(r"://[^@/\s]*@", "://***@", str(text))


          def with_sslmode(dsn):
              if "sslmode=" in dsn:
                  return dsn
              return dsn + ("&" if "?" in dsn else "?") + "sslmode=require"


          def cleaned(dsn):
              text = dsn.strip()
              if len(text) >= 2 and text[0] == text[-1] and text[0] in "\"'":
                  text = text[1:-1]
              return text


          def attempt(label, dsn):
              started = time.time()
              try:
                  with psycopg.connect(dsn, connect_timeout=20) as db:
                      one = db.execute("SELECT 1").fetchone()[0]
                      name = db.execute("SELECT current_database()").fetchone()[0]
                      server = db.execute("SELECT version()").fetchone()[0].split(",")[0]
                      tables = db.execute(
                          "SELECT count(*) FROM information_schema.tables WHERE table_schema='public'"
                      ).fetchone()[0]
                  print(f"{label}: PASS SELECT 1 = {one} in {time.time() - started:.1f}s, "
                        f"database = {name!r}, server = {server}, public tables = {tables}")
              except Exception as error:
                  print(f"{label}: FAIL {type(error).__name__}: {masked(error)}")


          raw = os.environ.get("DSN", "")
          if not raw:
              print("MISSING: nothing to connect to")
              raise SystemExit(0)
          attempt("as stored", with_sslmode(raw))
          tidy = cleaned(raw)
          if tidy != raw:
              attempt("after trimming whitespace/quotes", with_sslmode(tidy))
          PY

      - name: Publish the findings as annotations, the channel readable remotely
        if: always()
        run: |
          set -uo pipefail
          emit() {
            local name="$1" file="/tmp/$1.txt" text
            [ -f "$file" ] || text="(step produced no file)"
            text="$(tr '\n' '|' < "$file" | head -c 1200)"
            printf '::warning title=dbcheck-%s::%s\n' "$1" "${text:-"(empty)"}"
          }
          emit shape
          emit session
          emit live
