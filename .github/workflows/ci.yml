          sys.path.insert(0, "backend")
          from agent import sandbox
          runner = sandbox.detect()
          print("sandbox boundary :", runner.name)
          print("enforced         :", ", ".join(sorted(runner.capabilities)) or "(none)")
          print("missing          :", ", ".join(runner.missing()) or "(nothing)")
          print("filesystem       :", "isolated" if runner.filesystem_isolated else "NOT isolated")
          if runner.supports():
