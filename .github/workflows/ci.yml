      - run: python -m unittest discover -s tests -v
      - run: node --check docs/assets/app.js && node --check docs/assets/components.js && node --check docs/assets/answer.js && node --check backend/static/app.js && node --check backend/static/answer.js
      - run: node tests/browser_search.test.mjs
      - run: node tests/browser_answer.test.mjs
      # The components panel is a status report only if a card cannot go green without
