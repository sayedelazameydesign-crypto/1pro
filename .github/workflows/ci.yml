name: Validate Waha
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sqlite:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r backend/requirements.txt
      - run: python scripts/build_catalog.py --check
      # R1: the RAG corpus is generated, so CI proves the committed bytes are what
      # this code builds (determinism) and that the contract holds (self-test).
      - run: python scripts/rag_index.py --check
      - run: python scripts/rag_index.py --self-test      # R4: the retrieval metric is measured, and the committed report must match this
      # code + eval set byte for byte. A weak recall or a false answer fails CI here, and
      # the same number is what stats.json.vector_gate reads for the R5 decision.
      - run: python scripts/rag_eval.py --self-test
      - run: python scripts/rag_eval.py --check
      # R7: the boundary's enforcement tests skip where the kernel forbids
      # unprivileged user namespaces, and a skip must never read as a pass. This
      # prints which of the two this runner gives, so the CI log answers the
      # question instead of the reader assuming it. It deliberately does not
      # change kernel policy to make the tests run.
      - name: Report whether the code-execution boundary can be built here
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "backend")
          from agent import sandbox
          runner = sandbox.detect()
          print("sandbox boundary :", runner.name)
          print("enforced         :", ", ".join(sorted(runner.capabilities)) or "(none)")
          print("missing          :", ", ".join(runner.missing()) or "(nothing)")
          print("filesystem       :", "isolated" if runner.filesystem_isolated else "NOT isolated")
          if runner.supports():
              print("=> the enforcement tests in tests/test_agent_sandbox.py RAN")
          else:
              print("=> those tests will SKIP; execution refuses here by design")
              print("   reason:", getattr(runner, "reason", "incomplete boundary"))
          PY
      - run: python -m unittest discover -s tests -v
      - run: node --check docs/assets/app.js && node --check docs/assets/components.js && node --check docs/assets/answer.js && node --check backend/static/app.js && node --check backend/static/answer.js
      - run: node tests/browser_search.test.mjs
      - run: node tests/browser_answer.test.mjs
      # The components panel is a status report only if a card cannot go green without
      # a payload; the harness drives the DOM-free module with plain objects.
      - run: node tests/browser_components.test.mjs
      # The owner integrations console follows the same rule as the components
      # panel: a card is green only because a payload said so. Without this the
      # page could start claiming "ready" for a token the server never had.
      - run: node tests/browser_integrations.test.mjs
      # The deploy doctor validates the operator's environment offline; CI only
      # proves the checker itself, since no real keys exist here.
      - run: python scripts/deploy_doctor.py --self-test
      # Same reasoning for the live integrations checker: CI has no GitHub or
      # Vercel credentials, so it proves the checker's own logic -- above all that
      # a run which reached no API cannot report success.
      - run: python scripts/integrations_live_check.py --self-test
      # The key-sync script is what carries the secrets into production, so its two
      # offline guarantees are checked here too: the redactor passes text through
      # while masking values, and a stored team value that is not this team's id is
      # reported as a defect instead of being resolved around.
      - run: scripts/vercel_env_sync.sh --self-test

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: waha_test
          POSTGRES_USER: waha
          POSTGRES_PASSWORD: waha
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U waha -d waha_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://waha:waha@localhost:5432/waha_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r backend/requirements.txt
