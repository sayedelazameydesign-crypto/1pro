name: Vercel sync dry-run (read-only, temporary)

# Temporary operator tool, sibling of prod-probe.yml and db-check.yml.
#
# It answers one question that cannot be answered from the agent's sandbox: does the
# fixed scripts/vercel_env_sync.sh resolve the Vercel team and project against the
# real API, in the same environment the real sync runs in?
#
# READ-ONLY. It runs the sync script with --dry-run, which now validates the values,
# asks /v2/teams what the token can see, resolves the team and the project, and writes
# nothing to Vercel. The only other call is the psycopg SELECT 1 that --dry-run already
# performs against DATABASE_URL, exactly as the sync workflow does.
#
# `environment: Production` on purpose: GitHub resolves environment secrets over
# repository ones, so this reports the value the real sync will use -- and says whether
# the stored team value is one this token can actually read.
#
# Findings are republished as check-run annotations (the log host is outside the
# sandbox's allow-list). The script redacts every value; Actions masks secret values.
#
# Delete this file once the answer is known: it is not part of the product.
on:
  push:
    paths:
      - ".github/workflows/vercel-sync-dryrun-temp.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-sync-dryrun-temp
  cancel-in-progress: true

jobs:
  dryrun:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: Production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install psycopg so the database URL is proven by a live query
        run: python -m pip install --quiet "psycopg[binary]~=3.2"

      # Presence only, never a value. This repository is public, so a value stored as a
      # *variable* is readable by anyone; the sync workflow warns about the same five.
      - name: Flag any key stored as a variable instead of a secret
        env:
          V_DATABASE_URL: ${{ vars.DATABASE_URL }}
          V_GEMINI_API_KEY: ${{ vars.GEMINI_API_KEY }}
          V_WAHA_SECRET: ${{ vars.WAHA_SECRET }}
          V_VERCEL_TOKEN: ${{ vars.VERCEL_TOKEN }}
          V_VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
          V_VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          V_WAHA_OWNER_TOKEN: ${{ vars.WAHA_OWNER_TOKEN }}
        run: |
          set -uo pipefail
          : > /tmp/vars.txt
          for name in DATABASE_URL GEMINI_API_KEY WAHA_SECRET VERCEL_TOKEN \
                      VERCEL_TEAM_ID VERCEL_PROJECT_ID WAHA_OWNER_TOKEN; do
            key="V_$name"
            if [ -n "${!key:-}" ]; then
              printf '%s is a VARIABLE (public in a public repo)\n' "$name" >> /tmp/vars.txt
            fi
          done
          cat /tmp/vars.txt || true

      # Is the deployed service actually correct right now? Three public GETs, the same
      # ones prod-probe.yml makes: /health says which database and model the running
      # container resolved, /readyz runs a real SELECT 1, and neither needs a secret.
      - name: Probe the deployed service (public endpoints, read-only)
        id: prod
        run: |
          set -uo pipefail
          : > /tmp/prod.txt
          service="${WAHA_SERVICE_URL:-https://cela-umber.vercel.app}"
          curl -sS --max-time 45 "$service/health?probe=$(date +%s)" -o /tmp/health.json 2>/tmp/health.err || true
          jq -r '"health ok=\(.ok) database=\(.database) ai=\(.ai) rag_ready=\(.rag.ready) rows=\(.rag.rows // .rag.vectors // "?")"' \
            /tmp/health.json 2>/dev/null >> /tmp/prod.txt || echo "health: unreadable ($(head -c 120 /tmp/health.err))" >> /tmp/prod.txt
          code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 45 "$service/readyz?probe=$(date +%s)" 2>/dev/null || echo 000)"
          printf 'readyz=%s (204 = a real SELECT 1 reached the database)\n' "$code" >> /tmp/prod.txt
          cat /tmp/prod.txt

      # The same alias table the sync workflow uses, and the same script: the verdict
      # here is the verdict the real run would get, minus the writes.
      - name: Validate the secrets and resolve the scope (dry run)
        id: sync
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || vars.DATABASE_URL }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          DB_URL: ${{ secrets.DB_URL }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY || vars.NEON_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || vars.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          WAHA_SECRET: ${{ secrets.WAHA_SECRET || vars.WAHA_SECRET }}
          WAHA_APP_SECRET: ${{ secrets.WAHA_APP_SECRET }}
          WAHA_ALLOWED_ORIGINS: ${{ secrets.WAHA_ALLOWED_ORIGINS || vars.WAHA_ALLOWED_ORIGINS }}
          ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN || vars.VERCEL_TOKEN }}
          VERCEL_API_TOKEN: ${{ secrets.VERCEL_API_TOKEN }}
          VERCEL_ACCESS_TOKEN: ${{ secrets.VERCEL_ACCESS_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID || vars.VERCEL_PROJECT_ID }}
          VERCEL_PROJECT_NAME: ${{ vars.VERCEL_PROJECT_NAME }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID || vars.VERCEL_TEAM_ID }}
          VERCEL_TEAM_SLUG: ${{ vars.VERCEL_TEAM_SLUG }}
          WAHA_SERVICE_URL: ${{ vars.WAHA_SERVICE_URL }}
        run: |
          set -uo pipefail
          status=0
          scripts/vercel_env_sync.sh --dry-run > /tmp/dryrun.log 2>&1 || status=$?
          printf '%s\n' "$status" > /tmp/dryrun.status
          cat /tmp/dryrun.log

      - name: Publish the report as annotations (the only channel readable remotely)
        if: always()
        run: |
          set -uo pipefail
          echo "--- variables stored as variables (should be empty) ---"
          cat /tmp/vars.txt 2>/dev/null || true
          echo "--- dry run ---"
          cat /tmp/dryrun.log 2>/dev/null || echo "(no log)"
          printf '::warning title=dryrun-exit%s::%s\n' "$(cat /tmp/dryrun.status 2>/dev/null)" \
            "$(tr '\n' '|' < /tmp/dryrun.log 2>/dev/null | head -c 1800)"
          if [ -s /tmp/vars.txt ]; then
            printf '::warning title=public-variables::%s\n' \
              "$(tr '\n' '|' < /tmp/vars.txt | head -c 400)"
          fi
          printf '::warning title=deployed-service::%s\n' \
            "$(tr '\n' '|' < /tmp/prod.txt 2>/dev/null | head -c 700)"

      - name: Fail when the dry run failed
        run: |
          set -uo pipefail
          status="$(cat /tmp/dryrun.status 2>/dev/null || echo 9)"
          [ "$status" = "0" ] && { echo "dry run clean"; exit 0; }
          echo "dry run exited $status; see the report above"
          exit 1
