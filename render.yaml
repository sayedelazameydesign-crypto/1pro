# Render Blueprint for standalone Waha: Flask API + static docs frontend.
# Deploy from the repository root. docs/ is already-built static content, so the
# static site does not need a build command.
# Render may deploy both services in the same Blueprint sync; it does not
# guarantee their order. Keep the frontend disconnected until manual wiring.
# Set WAHA_ALLOWED_ORIGINS to waha-site's confirmed public origin after deploy;
# keep it to the origin only (scheme + host, with no path). Do not add dependsOn.
services:
  - type: web
    name: waha-backend
    runtime: python
    plan: free
    region: ohio
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 90
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: WAHA_SECRET
        generateValue: true
      - key: WAHA_ALLOWED_ORIGINS
        # Intentionally empty until Render assigns and we verify waha-site's URL.
        value: ""

  # Static sites use runtime: static (no compute plan); docs/ is already built.
  - type: web
    name: waha-site
    runtime: static
    # Isolate the root-level Vercel requirements.txt from Render's static build.
    rootDir: docs
    staticPublishPath: .
    # Avoid serving a stale API endpoint from an HTTP/CDN cache after redeploy.
    headers:
      - path: /data/config.json
        name: Cache-Control
        value: no-store
